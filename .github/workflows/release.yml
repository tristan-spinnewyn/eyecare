name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type d''incrément de version (auto calculé depuis la dernière release)'
        required: true
        type: choice
        default: 'patch'
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
      custom_version:
        description: 'Version personnalisée si bump_type = custom (ex: 0.2.0 ou v0.2.0)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Créer en tant que brouillon (draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Marquer comme pré-version (prerelease)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare & Bump Version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version_step.outputs.tag_name }}
      clean_version: ${{ steps.version_step.outputs.clean_version }}
      latest_release: ${{ steps.version_step.outputs.latest_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Calculate version & update package.json
        id: version_step
        env:
          INPUT_BUMP: ${{ inputs.bump_type || 'patch' }}
          INPUT_CUSTOM: ${{ inputs.custom_version || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');

            // 1. Détection de la dernière release
            let latestRelease = '';
            try {
              latestRelease = execSync('gh release view --json tagName -q .tagName', { encoding: 'utf-8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();
            } catch {}
            if (!latestRelease) {
              try {
                latestRelease = execSync('git describe --tags --abbrev=0', { encoding: 'utf-8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();
              } catch {}
            }

            console.log('Dernière release détectée:', latestRelease || '(aucune)');

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const currentPkgVersion = pkg.version || '0.1.0';
            const baseVersion = latestRelease ? latestRelease.replace(/^v/i, '') : currentPkgVersion;

            // 2. Détermination de la cible
            let cleanVersion = '';
            if (process.env.REF_TYPE === 'tag') {
              cleanVersion = process.env.REF_NAME.replace(/^v/i, '');
            } else if (process.env.INPUT_BUMP === 'custom' && process.env.INPUT_CUSTOM) {
              cleanVersion = process.env.INPUT_CUSTOM.trim().replace(/^v/i, '');
            } else {
              const parts = baseVersion.split('.').map((p) => parseInt(p, 10) || 0);
              let [maj = 0, min = 0, pat = 0] = parts;
              const bump = process.env.INPUT_BUMP || 'patch';
              if (bump === 'major') { maj += 1; min = 0; pat = 0; }
              else if (bump === 'minor') { min += 1; pat = 0; }
              else { pat += 1; }
              cleanVersion = \`\${maj}.\${min}.\${pat}\`;
            }

            const tagName = 'v' + cleanVersion;

            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag_name=' + tagName + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'clean_version=' + cleanVersion + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'latest_release=' + (latestRelease || 'aucune') + '\n');

            // 3. Mise à jour de package.json & package-lock.json
            pkg.version = cleanVersion;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            if (fs.existsSync('package-lock.json')) {
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = cleanVersion;
              if (lock.packages && lock.packages['']) lock.packages[''].version = cleanVersion;
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            }

            // 4. Résumé GitHub Actions
            const summary = [
              '### 🚀 Information de Release',
              '- **Dernière release détectée** : ' + (latestRelease ? \`\` \${latestRelease} \`\` : '*(aucune)*'),
              '- **Nouvelle version calculée** : \`\` ' + cleanVersion + ' \`\` (' + tagName + ')',
              '- **package.json & package-lock.json** : mis à jour vers \`\` ' + cleanVersion + ' \`\`'
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          "

      - name: Commit & push updated package.json to repository
        env:
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          CLEAN_VERSION: ${{ steps.version_step.outputs.clean_version }}
        run: |
          if ! git diff --quiet package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to ${CLEAN_VERSION} [skip ci]"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH" || echo "Warning: Failed to push version bump to $TARGET_BRANCH."
            echo "Version bump committed and pushed to $TARGET_BRANCH"
          else
            echo "package.json is already at version ${CLEAN_VERSION}"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_args: '--win'
            artifact_name: dist-windows
          - os: ubuntu-latest
            platform: linux
            build_args: '--linux'
            artifact_name: dist-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Sync package.json version locally for build
        env:
          CLEAN_VERSION: ${{ needs.prepare.outputs.clean_version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.CLEAN_VERSION;
            if (v) {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = v;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              if (fs.existsSync('package-lock.json')) {
                const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
                lock.version = v;
                if (lock.packages && lock.packages['']) lock.packages[''].version = v;
                fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
              }
            }
          "

      - name: Build and package executable
        run: npm run dist -- ${{ matrix.build_args }} --publish never

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Release ${{ needs.prepare.outputs.tag_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/latest*.yml
            dist-artifacts/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
