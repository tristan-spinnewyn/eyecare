name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release (ex: v1.0.0 ou 1.0.0). Laisser vide pour utiliser la version calculée'
        required: false
        type: string
        default: ''
      bump_type:
        description: 'Type d''incrément si tag_name est vide (patch, minor, major)'
        required: false
        type: choice
        default: 'patch'
        options:
          - 'patch'
          - 'minor'
          - 'major'
      draft:
        description: 'Créer en tant que brouillon (draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Marquer comme pré-version (prerelease)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_args: '--win'
            artifact_name: dist-windows
          - os: ubuntu-latest
            platform: linux
            build_args: '--linux'
            artifact_name: dist-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Sync package.json version with release
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_BUMP: ${{ inputs.bump_type }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-helper.cjs sync

      - name: Build and package executable
        run: npm run dist -- ${{ matrix.build_args }} --publish never

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: warn
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Determine tag and release name
        id: release_info
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_BUMP: ${{ inputs.bump_type }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-helper.cjs info
          node scripts/release-helper.cjs summary

      - name: Commit and push updated package.json to repository
        env:
          TARGET_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || github.event.repository.default_branch || 'main' }}
          TARGET_VERSION: ${{ steps.release_info.outputs.clean_version }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_BUMP: ${{ inputs.bump_type }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-helper.cjs sync
          if ! git diff --quiet package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to ${TARGET_VERSION} [skip ci]"
            git pull --rebase origin "$TARGET_BRANCH" || true
            git push origin "HEAD:$TARGET_BRANCH" || echo "Warning: Direct push to protected $TARGET_BRANCH blocked by rule, release tag and assets are still published."
            echo "Version bump processed for $TARGET_BRANCH"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          make_latest: "true"
          files: |
            dist-artifacts/*.exe
            dist-artifacts/*.AppImage
            dist-artifacts/*.deb
            dist-artifacts/latest*.yml
            dist-artifacts/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
